  <rect x="112" y="504" width="318" height="44" rx="22" fill="#1f4d36"/>
  <text x="271" y="533" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Book an AI Trust Briefing</text>
